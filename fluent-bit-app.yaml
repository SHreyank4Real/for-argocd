apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:SHreyank4Real/for-argocd.git
    targetRevision: main
    path: fluent-bit
    helm:
      valueFiles:
        - my-values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: fluent-bit

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true

