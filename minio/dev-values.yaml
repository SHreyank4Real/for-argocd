# Single-pod distributed MinIO (StatefulSet)
mode: distributed

# One pod only
pools: 1
replicas: 1
drivesPerNode: 1

# Resource sizing for t3a.medium
resources:
  requests:
    cpu: "500m"
    memory: "2Gi"
  limits:
    cpu: "1500m"
    memory: "3Gi"

# Keep MinIO itself on HTTP; TLS handled by ingress-nginx
tls:
  enabled: false

# S3 API ingress (api.211125781340.realhandsonlabs.net)
service:
  type: ClusterIP
  port: "9000"

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/tls-acme: "true"
  path: /
  hosts:
    - api.211125781340.realhandsonlabs.net
  tls:
    - secretName: minio-api-tls
      hosts:
        - api.211125781340.realhandsonlabs.net

# Console UI ingress (minio.211125781340.realhandsonlabs.net)
consoleService:
  type: ClusterIP
  port: "9001"

consoleIngress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/tls-acme: "true"
  path: /
  hosts:
    - minio.211125781340.realhandsonlabs.net
  tls:
    - secretName: minio-console-tls
      hosts:
        - minio.211125781340.realhandsonlabs.net

# Optional: smaller disk for dev (adjust as needed)
persistence:
  enabled: true
  size: 100Gi
  accessMode: ReadWriteOnce