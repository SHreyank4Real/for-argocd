# Single-pod standalone MinIO (Deployment)
# Distributed mode requires 4+ nodes for erasure coding; use standalone for single-node
mode: standalone

# Resource sizing for t3a.medium
resources:
  requests:
    cpu: "500m"
    memory: "2Gi"
  limits:
    cpu: "1500m"
    memory: "3Gi"

# Keep MinIO itself on HTTP; TLS handled by ingress-nginx
tls:
  enabled: false

# S3 API ingress (api.211125528109.realhandsonlabs.net)
service:
  type: ClusterIP
  port: "9000"

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/tls-acme: "true"
  path: /
  hosts:
    - api.211125528109.realhandsonlabs.net
  tls:
    - secretName: minio-api-tls
      hosts:
        - api.211125528109.realhandsonlabs.net

# Console UI ingress (minio.211125528109.realhandsonlabs.net)
consoleService:
  type: ClusterIP
  port: "9001"

consoleIngress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/tls-acme: "true"
  path: /
  hosts:
    - minio.211125528109.realhandsonlabs.net
  tls:
    - secretName: minio-console-tls
      hosts:
        - minio.211125528109.realhandsonlabs.net

# Optional: smaller disk for dev (adjust as needed)
persistence:
  enabled: true
  storageClass: gp2
  size: 50Gi
  accessMode: ReadWriteOnce

# Buckets to create automatically for dev
buckets:
  - name: my-redis-logs-bucket
    policy: none
    purge: false
    versioning: false