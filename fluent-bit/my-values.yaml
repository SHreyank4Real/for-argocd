serviceAccount:
  create: true
  name: fluent-bit

rbac:
  create: true

env:
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: aws-credentials
        key: AWS_ACCESS_KEY_ID
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: aws-credentials
        key: AWS_SECRET_ACCESS_KEY

aws:
  credentialsSecretName: aws-credentials
  # Fill these with your actual MinIO or AWS credentials (do not commit real secrets)
  accessKey: "AKIATCKAP4YWSQDG5LPV"
  secretKey: "EY45UdIhKHW4ypBXGkxxQyUHRX1ilnoxfT7A6tq2s"

extraVolumes:
  - name: buffer
    emptyDir: {}

extraVolumeMounts:
  - name: buffer
    mountPath: /buffers

config:
  service: |
    [SERVICE]
        Flush        5
        Log_Level    info
        Parsers_File parsers.conf
        storage.path /buffers
        HTTP_Server  On
        HTTP_Listen  0.0.0.0
        HTTP_Port    2020

  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Parser            cri
        Tag               kube.*
        Refresh_Interval  5
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Merge_Log           On
        Keep_Log            Off

    # Filter Redis logs (based on container name)
    [FILTER]
        Name    grep
        Match   kube.*
        Regex   $kubernetes['container_name'] batman

  outputs: |
    [OUTPUT]
        Name              s3
        Match             kube.*
        bucket            my-redis-logs-bucket
        region            us-east-1
        total_file_size   5M
        upload_timeout    1m
        store_dir         /buffers
        s3_key_format     /batman-logs/%Y/%m/%d/%H/%M/%S-$UUID.gz
        compression       gzip

  customParsers: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z